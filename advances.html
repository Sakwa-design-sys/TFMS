{% extends 'base.html' %}{% block content %}<h2>Worker Advances</h2><form method="post"><select name="worker_id">{% for w in workers %}<option value="{{w.id}}">{{w.worker_no}} — {{w.name}}</option>{% endfor %}</select><input type="number" step="0.01" name="amount" placeholder="Amount" required><input name="note" placeholder="Reason"><button>Record Advance</button></form><table><tr><th>Date</th><th>Worker</th><th>Amount</th><th>Note</th></tr>{% for x in rows %}<tr><td>{{x.advance_date}}</td><td>{{x.worker.name}}</td><td>{{x.amount}}</td><td>{{x.note}}</td></tr>{% endfor %}</table>{% endblock %}
