services:
  - type: web
    name: kapkosgei-outgrowers-farm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kapkosgei-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: kapkosgei-db
    plan: free
