services:
  - type: web
    name: green-star-tea-management
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: green-star-tea-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: BUSINESS_NAME
        value: GREEN STAR TEA ESTATE MANAGEMENT SYSTEM

databases:
  - name: green-star-tea-db
    plan: free
