{% extends 'base.html' %}{% block content %}<h1>Tea Fields</h1><div class="panel"><form method="post" class="grid"><label>Estate<select name="estate_id" required>{% for e in estates %}<option value="{{e.id}}">{{e.name}}</option>{% endfor %}</select></label><label>Field name<input name="name" required></label><label>Acres<input name="acres" type="number" step="0.01"></label><label>Tea variety<input name="variety"></label><label>Planting year<input name="planting_year" type="number"></label><button>Add field</button></form></div><div class="panel"><table><tr><th>Estate</th><th>Field</th><th>Acres</th><th>Variety</th><th>Year</th></tr>{% for x in rows %}<tr><td>{{x.estate.name}}</td><td>{{x.name}}</td><td>{{x.acres}}</td><td>{{x.variety}}</td><td>{{x.planting_year}}</td></tr>{% endfor %}</table></div>{% endblock %}
