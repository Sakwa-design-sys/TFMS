{% extends 'base.html' %}{% block content %}<h1>Expenses</h1><div class="panel"><form method="post" class="grid"><label>Date<input name="date" type="date" value="{{today}}" required></label><label>Category<input name="category" required></label><label>Description<input name="description"></label><label>Amount<input name="amount" type="number" step="0.01" required></label><button>Submit expense</button></form></div><div class="panel"><table><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Status</th><th></th></tr>{% for x in rows %}<tr><td>{{x.expense_date}}</td><td>{{x.category}}</td><td>{{x.description}}</td><td>KES {{x.amount}}</td><td>{{x.status}}</td><td>{% if x.status=='Pending' %}<a class="btn" href="{{url_for('approve_expense',i=x.id)}}">Approve</a>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
