{% extends 'base.html' %}{% block content %}<h1>Stores & Inventory</h1><div class="panel"><form method="post" class="grid"><label>Item<input name="name" required></label><label>Category<input name="category"></label><label>Unit<input name="unit" value="pcs"></label><label>Opening quantity<input name="opening" type="number" step="0.01"></label><label>Minimum stock<input name="min_stock" type="number" step="0.01"></label><label>Unit cost<input name="cost" type="number" step="0.01"></label><button>Add item</button></form></div><div class="panel"><table><tr><th>Item</th><th>Category</th><th>Qty</th><th>Unit</th><th>Min</th><th>Cost</th><th>Stock action</th></tr>{% for x in rows %}<tr><td>{{x.name}}</td><td>{{x.category}}</td><td class="{% if x.quantity<=x.min_stock %}low{% endif %}">{{x.quantity}}</td><td>{{x.unit}}</td><td>{{x.min_stock}}</td><td>{{x.cost}}</td><td><form method="post" action="{{url_for('inventory_txn',i=x.id)}}" class="inline"><select name="type"><option>Purchase</option><option>Issue</option><option>Wastage</option><option>Return</option></select><input name="quantity" type="number" step="0.01" placeholder="Qty" required><input name="reference" placeholder="Ref"><button>Post</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
