{% extends 'base.html' %}{% block content %}<h1>Factory Intake</h1><div class="panel"><form method="post" class="grid"><label>Date<input name="date" type="date" value="{{today}}" required></label><label>Estate<select name="estate_id">{% for e in estates %}<option value="{{e.id}}">{{e.name}}</option>{% endfor %}</select></label><label>Collection KG<input name="collection_kg" type="number" step="0.01"></label><label>Factory KG<input name="factory_kg" type="number" step="0.01"></label><label>Vehicle<input name="vehicle"></label><label>Driver<input name="driver"></label><button>Record intake</button></form></div><div class="panel"><table><tr><th>Date</th><th>Estate</th><th>Collected</th><th>Factory</th><th>Variance</th><th>Vehicle</th></tr>{% for x in rows %}<tr><td>{{x.intake_date}}</td><td>{{x.estate.name}}</td><td>{{x.collection_kg}}</td><td>{{x.factory_kg}}</td><td>{{x.collection_kg-x.factory_kg}}</td><td>{{x.vehicle}}</td></tr>{% endfor %}</table></div>{% endblock %}
