{% extends 'base.html' %}{% block content %}<h1>Tea Sales</h1><div class="panel"><form method="post" class="grid"><label>Date<input name="date" type="date" value="{{today}}" required></label><label>Buyer<select name="buyer_id">{% for b in buyers %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></label><label>Grade<select name="grade_id">{% for g in grades %}<option value="{{g.id}}">{{g.name}}</option>{% endfor %}</select></label><label>Quantity KG<input name="quantity" type="number" step="0.01" required></label><label>Price / KG<input name="price" type="number" step="0.01" required></label><button>Record sale</button></form></div><div class="panel"><table><tr><th>Date</th><th>Buyer</th><th>Grade</th><th>KG</th><th>Price</th><th>Total</th></tr>{% for x in rows %}<tr><td>{{x.sale_date}}</td><td>{{x.buyer.name}}</td><td>{{x.grade.name}}</td><td>{{x.quantity_kg}}</td><td>{{x.price_per_kg}}</td><td>KES {{x.total}}</td></tr>{% endfor %}</table></div>{% endblock %}
