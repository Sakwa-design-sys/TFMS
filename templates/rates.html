{% extends 'base.html' %}{% block content %}<h1>Tea Rates</h1><div class="panel"><form method="post" class="grid"><label>Rate per KG (KES)<input name="rate" type="number" step="0.01" required></label><label>Effective from<input name="from" type="date" value="{{today}}" required></label><button>Save rate</button></form></div><div class="panel"><table><tr><th>Rate</th><th>Effective from</th><th>To</th><th>Active</th></tr>{% for x in rows %}<tr><td>KES {{x.rate}}</td><td>{{x.effective_from}}</td><td>{{x.effective_to or 'Open'}}</td><td>{{x.active}}</td></tr>{% endfor %}</table></div>{% endblock %}
