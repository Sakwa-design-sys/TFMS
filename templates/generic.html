{% extends 'base.html' %}{% block content %}<div class="head"><h1>{{title}}</h1></div><div class="panel"><form method="post" class="grid">{% for f in fields %}<label>{{f[0]}}<input name="{{f[1]}}" type="{{f[2] if f|length>2 else 'text'}}" value="{{f[3] if f|length>3 else ''}}" required></label>{% endfor %}<button>Save</button></form></div><div class="panel"><h2>Records</h2><table><thead><tr>{% for h in headers %}<th>{{h}}</th>{% endfor %}</tr></thead><tbody>{% for row in rows %}<tr>{% for v in row %}<td>{{v}}</td>{% endfor %}</tr>{% else %}<tr><td colspan="20">No records yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
