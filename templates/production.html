{% extends 'base.html' %}{% block content %}<h1>Factory Production</h1><div class="panel"><form method="post" class="grid"><label>Date<input name="date" type="date" value="{{today}}" required></label><label>Grade<select name="grade_id">{% for g in grades %}<option value="{{g.id}}">{{g.name}}</option>{% endfor %}</select></label><label>Input KG<input name="input_kg" type="number" step="0.01"></label><label>Output KG<input name="output_kg" type="number" step="0.01" required></label><label>Waste KG<input name="waste_kg" type="number" step="0.01"></label><label>Batch No.<input name="batch_no"></label><button>Record production</button></form></div><div class="panel"><table><tr><th>Date</th><th>Batch</th><th>Grade</th><th>Input</th><th>Output</th><th>Waste</th></tr>{% for x in rows %}<tr><td>{{x.production_date}}</td><td>{{x.batch_no}}</td><td>{{x.grade.name}}</td><td>{{x.input_kg}}</td><td>{{x.output_kg}}</td><td>{{x.waste_kg}}</td></tr>{% endfor %}</table></div>{% endblock %}
