{% extends 'base.html' %}{% block content %}<h1>Worker Advances</h1><div class="panel"><form method="post" class="grid"><label>Worker<select name="worker_id">{% for w in workers %}<option value="{{w.id}}">{{w.name}}</option>{% endfor %}</select></label><label>Amount<input name="amount" type="number" step="0.01" required></label><label>Date<input name="date" type="date" value="{{today}}" required></label><label>Note<input name="note"></label><button>Record advance</button></form></div><div class="panel"><table><tr><th>Date</th><th>Worker</th><th>Amount</th><th>Note</th></tr>{% for x in rows %}<tr><td>{{x.advance_date}}</td><td>{{x.worker.name}}</td><td>KES {{x.amount}}</td><td>{{x.note}}</td></tr>{% endfor %}</table></div>{% endblock %}
