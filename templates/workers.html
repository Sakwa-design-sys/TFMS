{% extends 'base.html' %}{% block content %}<h1>Workers</h1><div class="panel"><form method="post" class="grid"><label>Employee No.<input name="worker_no" required></label><label>Name<input name="name" required></label><label>Phone<input name="phone"></label><label>ID No.<input name="id_no"></label><label>Department<input name="department" value="Plucking"></label><label>Section<input name="section"></label><label>Payment<select name="payment_method"><option>M-Pesa</option><option>Bank</option><option>Cash</option></select></label><button>Add worker</button></form></div><div class="panel"><table><tr><th>No.</th><th>Name</th><th>Phone</th><th>Department</th><th>Section</th><th>Payment</th><th>Status</th></tr>{% for x in rows %}<tr><td>{{x.worker_no}}</td><td>{{x.name}}</td><td>{{x.phone}}</td><td>{{x.department}}</td><td>{{x.section}}</td><td>{{x.payment_method}}</td><td>{{x.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
