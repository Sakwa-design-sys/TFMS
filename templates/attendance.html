{% extends 'base.html' %}{% block content %}<h1>Attendance</h1><div class="panel"><form method="post" class="grid"><label>Date<input name="date" type="date" value="{{today}}" required></label><label>Worker<select name="worker_id">{% for w in workers %}<option value="{{w.id}}">{{w.name}}</option>{% endfor %}</select></label><label>Status<select name="status"><option>Present</option><option>Absent</option><option>Leave</option><option>Sick</option></select></label><button>Save attendance</button></form></div><div class="panel"><table><tr><th>Date</th><th>Worker</th><th>Status</th></tr>{% for x in rows %}<tr><td>{{x.attend_date}}</td><td>{{x.worker.name}}</td><td>{{x.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
