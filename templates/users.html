{% extends 'base.html' %}{% block content %}<h1>Users</h1><div class="panel"><form method="post" class="grid"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><label>Role<select name="role">{% for r in roles %}<option>{{r}}</option>{% endfor %}</select></label><button>Create user</button></form></div><div class="panel"><table><tr><th>Username</th><th>Role</th><th>Active</th></tr>{% for x in rows %}<tr><td>{{x.username}}</td><td>{{x.role}}</td><td>{{x.active}}</td></tr>{% endfor %}</table></div>{% endblock %}
