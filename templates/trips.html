{% extends 'base.html' %}{% block content %}<h1>Tea Transport</h1><div class="panel"><form method="post" class="grid"><label>Date<input name="date" type="date" value="{{today}}" required></label><label>Vehicle<select name="vehicle_id">{% for v in vehicles %}<option value="{{v.id}}">{{v.reg_no}}</option>{% endfor %}</select></label><label>Driver<input name="driver" required></label><label>Pickup<input name="pickup" required></label><label>Destination<input name="destination" required></label><label>Tea KG<input name="kg" type="number" step="0.01"></label><label>Reference<input name="reference"></label><button>Record trip</button></form></div><div class="panel"><table><tr><th>Date</th><th>Vehicle</th><th>Driver</th><th>Route</th><th>KG</th></tr>{% for x in rows %}<tr><td>{{x.trip_date}}</td><td>{{x.vehicle.reg_no}}</td><td>{{x.driver}}</td><td>{{x.pickup}} → {{x.destination}}</td><td>{{x.kg}}</td></tr>{% endfor %}</table></div>{% endblock %}
